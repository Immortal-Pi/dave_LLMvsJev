# Skill catalogs per adapter. Durations for 'dave' come from scripts/calibrate_skills.py
# (see docs/skills.md); do not change them without re-running calibration.
#
# A phase holds its buttons for 'ticks' frames, or until predicate 'until' holds (at most
# 'max_ticks'). Buttons are released between phases and after the last one. A skill's hard
# cap is the sum of its phase budgets.
skills:
  executor:
    hazard_radius_px: 48   # new_hazard_nearby: 3 tiles, centre-to-centre on either axis
    # Threat prediction (control/threats.py, docs/skills.md): plasma flies 2 px/tick (plasma.c),
    # monsters are extrapolated linearly. Candidates predicted to touch a threat or hazard are
    # masked unless all do; threat_incoming stops a walk or wait when contact is this close.
    threats:
      horizon_ticks: 48
      margin_px: 2
      monster_growth_ticks: 8
      interrupt_ticks: 16
      mask: true

  # Movement for reachability waypoints (control/reach.py), measured on level 1 (2026-10-03):
  # arc_px = rise above the start by tick after Up (flat-floor jump, lands at tick 94); air
  # control and free fall are 1 px/tick; the short jumps hold the direction for 32 ticks.
  # Offsets from Dave's x: walking right off a ledge ending at px 127 he falls at x 124 and a
  # rightward jump lands on a ledge starting at px 64 at x 56 (feet at +4 and +8); walking into
  # a wall at px 176 he stops at x 164 (body right edge +11, left edge assumed symmetric, +4).
  reach:
    dave:
      arc_px: [0, 1, 1, 3, 3, 6, 6, 8, 8, 10, 10, 12, 12, 14, 14, 16, 16, 18, 18, 20, 20, 22, 22, 23, 23, 25, 25, 26, 26, 27, 27, 28, 28, 29, 29, 30, 30, 31, 31, 32, 32, 32, 32, 32, 32, 32, 32, 32, 32, 32, 32, 32, 32, 32, 32, 32, 32, 31, 31, 30, 30, 29, 29, 28, 28, 27, 27, 26, 26, 25, 25, 23, 23, 21, 21, 19, 19, 17, 17, 15, 15, 13, 13, 11, 11, 9, 9, 7, 7, 5, 5, 2, 2, 0, 0]
      air_px_per_tick: 1
      walk_px_per_3_ticks: 2
      fall_px_per_tick: 1
      short_hold_ticks: 32
      body_px: [4, 11]
      foot_px: [4, 8]
      head_px: [4, 9]  # dave.c dave_collision_top: (x+4, y+1) and (x+9, y+1)

  catalogs:
    # Synthetic test platformer (not Dangerous Dave); unchanged since Phase 1.
    fixture:
      - {name: move_left,  kind: single, phases: [{buttons: [left],        ticks: 1}]}
      - {name: move_right, kind: single, phases: [{buttons: [right],       ticks: 1}]}
      - {name: jump,       kind: single, phases: [{buttons: [jump],        ticks: 3}]}
      - {name: jump_left,  kind: single, phases: [{buttons: [jump, left],  ticks: 3}]}
      - {name: jump_right, kind: single, phases: [{buttons: [jump, right], ticks: 3}]}
      - {name: wait,       kind: single, phases: [{buttons: [],            ticks: 1}]}

    dave:
      # Walking moves 2 px every 3 ticks: 24 ticks = 1 tile (16 px).
      - name: move_left_1
        kind: single
        description: walk left about 1 tile
        preconditions: [alive]
        phases: [{buttons: [left], ticks: 24}]
        interrupt_on: [death, terminal, hazard_contact, new_hazard_nearby, threat_incoming]
      - name: move_right_1
        kind: single
        description: walk right about 1 tile
        preconditions: [alive]
        phases: [{buttons: [right], ticks: 24}]
        interrupt_on: [death, terminal, hazard_contact, new_hazard_nearby, threat_incoming]
      - name: move_left_3
        kind: single
        description: walk left about 3 tiles
        preconditions: [alive]
        phases: [{buttons: [left], ticks: 72}]
        interrupt_on: [death, terminal, hazard_contact, new_hazard_nearby, threat_incoming]
      - name: move_right_3
        kind: single
        description: walk right about 3 tiles
        preconditions: [alive]
        phases: [{buttons: [right], ticks: 72}]
        interrupt_on: [death, terminal, hazard_contact, new_hazard_nearby, threat_incoming]

      # A jump starts when Up is pressed on the ground and the hidden landing cooldown
      # (5 ticks) has expired. Up is released as soon as the jump starts, because holding
      # it re-jumps on landing. A flat jump rises 32 px (2 tiles) and lands after 94 ticks;
      # air control moves 1 px/tick.
      # Sideways jumps press only Up until the jump starts, then the direction: holding the
      # direction during the landing cooldown walked Dave off 1-tile ledges before takeoff
      # (level 1 pillars). Measured: flat-ground distances and frames are unchanged.
      - name: jump_up
        kind: macro
        description: jump straight up and land
        preconditions: [on_ground]
        phases:
          - {buttons: [jump], until: jumping, max_ticks: 6}
          - {buttons: [], until: landed, max_ticks: 200}
        interrupt_on: [death, terminal, hazard_contact, new_hazard_nearby]
      - name: jump_left
        kind: macro
        description: long jump left (about 6 tiles on flat ground) and land
        preconditions: [on_ground]
        phases:
          - {buttons: [jump], until: jumping, max_ticks: 6}
          - {buttons: [left], until: landed, max_ticks: 200}
        interrupt_on: [death, terminal, hazard_contact, new_hazard_nearby]
      - name: jump_right
        kind: macro
        description: long jump right (about 6 tiles on flat ground) and land
        preconditions: [on_ground]
        phases:
          - {buttons: [jump], until: jumping, max_ticks: 6}
          - {buttons: [right], until: landed, max_ticks: 200}
        interrupt_on: [death, terminal, hazard_contact, new_hazard_nearby]
      - name: jump_left_short
        kind: macro
        description: jump left about 2 tiles, then drop straight down
        preconditions: [on_ground]
        phases:
          - {buttons: [jump], until: jumping, max_ticks: 6}
          - {buttons: [left], ticks: 32}
          - {buttons: [], until: landed, max_ticks: 200}
        interrupt_on: [death, terminal, hazard_contact, new_hazard_nearby]
      - name: jump_right_short
        kind: macro
        description: jump right about 2 tiles, then drop straight down
        preconditions: [on_ground]
        phases:
          - {buttons: [jump], until: jumping, max_ticks: 6}
          - {buttons: [right], ticks: 32}
          - {buttons: [], until: landed, max_ticks: 200}
        interrupt_on: [death, terminal, hazard_contact, new_hazard_nearby]

      # One bullet at a time; it spawns 8 px ahead in the facing direction and moves 2 px/tick.
      - name: shoot
        kind: single
        description: fire the gun in the facing direction
        preconditions: [alive, has_gun, facing_side, no_bullet]
        phases: [{buttons: [fire], ticks: 1}]
        interrupt_on: [death, terminal]

      # wait_long has no precondition so a legal candidate always exists (e.g. while burning).
      - name: wait_short
        kind: single
        description: release all keys for 6 ticks (covers the landing cooldown)
        preconditions: [alive]
        phases: [{buttons: [], ticks: 6}]
        interrupt_on: [death, terminal, hazard_contact, new_hazard_nearby, threat_incoming]
      - name: wait_long
        kind: single
        description: release all keys for 24 ticks
        phases: [{buttons: [], ticks: 24}]
        interrupt_on: [death, terminal, new_hazard_nearby, threat_incoming]
